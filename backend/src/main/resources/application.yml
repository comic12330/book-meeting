server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: meeting-room
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/meeting_room?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
  # 定时任务线程池：默认只有一个线程，多个任务会排队互相阻塞。
  # 目前只有「已结束预定转已完成」一项，留 2 个线程是为后续新增统计类任务预留，
  # 同时改掉线程名前缀，日志里一眼能看出是定时任务在跑。
  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: meeting-task-

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.meetingroom.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: false

meeting:
  token:
    secret: meeting-room-2026-hmac-secret
    expire-seconds: 7200
  # 分页属技术保护参数，放配置文件由部署方掌握，不给管理员在线改
  # 业务运营参数（时长上限、可预定时段、容量上限）在 sys_config 表，见「系统参数」页面
  page:
    default-size: 10
    max-size: 100
  # 定时任务调度参数（技术参数，不进 sys_config）
  task:
    # 已结束预定转已完成的扫描间隔：每 5 分钟一次（秒 分 时 日 月 周）
    complete-expired-cron: "0 */5 * * * *"

logging:
  level:
    com.example.meetingroom.mapper: debug
